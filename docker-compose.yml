services:
  mysql:
    image: mysql:8.0
    container_name: lingolens-mysql
    restart: unless-stopped
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_DATABASE: lingolens
      MYSQL_USER: lingolens
      MYSQL_PASSWORD: lingolens_dev
      MYSQL_ROOT_PASSWORD: root_dev
    ports: ['3306:3306']
    volumes:
      - lingolens_mysql_data:/var/lib/mysql
    healthcheck:
      test: ['CMD', 'mysqladmin', 'ping', '-h', '127.0.0.1', '-uroot', '-proot_dev']
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 20s

volumes:
  lingolens_mysql_data:
    name: lingolens_mysql_data
