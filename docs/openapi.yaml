# Sumber kontrak Fase 1; klarifikasi reset JWT, siluet ID/gambar, dan avatar nullable.
openapi: 3.1.0
info:
  title: LingoLens API
  version: 1.0.0
  description: Kontrak Fase 1; draft menunggu penandatanganan PM.
servers:
  - url: /api/v1
paths:
  /health:
    get:
      operationId: health
      summary: Periksa kesehatan layanan
      security: []
      responses:
        '200':
          description: Berhasil
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
              example:
                success: true
                data:
                  status: ok
                  db: ok
        '429':
          $ref: '#/components/responses/429'
        '500':
          $ref: '#/components/responses/500'
  /auth/guest:
    post:
      operationId: guest
      summary: Buat akun tamu dengan 20 XP awal
      security: []
      description: 422 VALIDATION_ERROR bila nickname kosong atau ditolak kebijakan kata kasar.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GuestRequest'
            example:
              nickname: Bintang
      responses:
        '201':
          description: Berhasil dibuat
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GuestResponse'
              example:
                success: true
                data:
                  token: example-jwt-not-a-real-token
                  user:
                    id: u-demo
                    nickname: Bintang
                    level: 1
                    totalXp: 20
                    xpInLevel: 20
                    xpForNextLevel: 100
                    streak: 0
                    collectedCount: 0
        '422':
          description: 'VALIDATION_ERROR: Nickname kosong atau ditolak kebijakan kata kasar.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                VALIDATION_ERROR:
                  summary: Nickname kosong atau ditolak kebijakan kata kasar.
                  value:
                    success: false
                    error:
                      code: VALIDATION_ERROR
                      message: Nickname kosong atau ditolak kebijakan kata kasar.
                      details: null
        '429':
          $ref: '#/components/responses/429'
        '500':
          $ref: '#/components/responses/500'
  /me:
    get:
      operationId: me
      summary: Baca profil dan kemajuan
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Berhasil
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MeResponse'
              example:
                success: true
                data:
                  id: u-demo
                  nickname: Bintang
                  level: 1
                  totalXp: 20
                  xpInLevel: 20
                  xpForNextLevel: 100
                  streak: 0
                  collectedCount: 0
        '401':
          $ref: '#/components/responses/401'
        '429':
          $ref: '#/components/responses/429'
        '500':
          $ref: '#/components/responses/500'
    patch:
      operationId: updateMe
      summary: Perbarui profil
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateMeRequest'
            example:
              nickname: Bintang
      responses:
        '200':
          description: Berhasil
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UpdateMeResponse'
              example:
                success: true
                data:
                  id: u-demo
                  nickname: Bintang
                  level: 1
                  totalXp: 20
                  xpInLevel: 20
                  xpForNextLevel: 100
                  streak: 0
                  collectedCount: 0
        '401':
          $ref: '#/components/responses/401'
        '422':
          description: 'VALIDATION_ERROR: Nickname atau avatarKey tidak sah.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                VALIDATION_ERROR:
                  summary: Nickname atau avatarKey tidak sah.
                  value:
                    success: false
                    error:
                      code: VALIDATION_ERROR
                      message: Nickname atau avatarKey tidak sah.
                      details: null
        '429':
          $ref: '#/components/responses/429'
        '500':
          $ref: '#/components/responses/500'
  /me/collection:
    get:
      operationId: collection
      summary: Baca koleksi tanpa membuka kartu terkunci
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Berhasil
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CollectionResponse'
              example:
                success: true
                data:
                  - vocabulary:
                      id: v-cup
                      word: cup
                      phonetic: /kʌp/
                      meaning: cangkir
                      imageUrl: /images/cup.svg
                      category: Minum dan makan
                      translations: []
                      exampleSentence:
                        id: s-cup-choice
                        text: This is my red cup.
                      related: []
                    collected: true
                    bestScore: 100
                  - vocabulary:
                      id: v-book
                      imageUrl: /images/book.svg
                    collected: false
                    bestScore: 0
        '401':
          $ref: '#/components/responses/401'
        '429':
          $ref: '#/components/responses/429'
        '500':
          $ref: '#/components/responses/500'
  /missions:
    get:
      operationId: missions
      summary: Daftar misi
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Berhasil
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MissionsResponse'
              example:
                success: true
                data:
                  - id: m1
                    slug: untuk-minum
                    title: Untuk minum
                    hint: Cari wadah minuman
                    category: Minum dan makan
                    difficulty: easy
                    rewardXp: 110
                    status: available
                    bestStars: 0
                    exercisePlan:
                      - choice
                      - cloze
                      - order
        '401':
          $ref: '#/components/responses/401'
        '429':
          $ref: '#/components/responses/429'
        '500':
          $ref: '#/components/responses/500'
  /missions/{id}:
    get:
      operationId: missionDetail
      summary: Baca rincian misi dan label yang diterima
      security:
        - bearerAuth: []
      description: 404 NOT_FOUND bila misi tidak ditemukan.
      parameters:
        - name: id
          in: path
          required: true
          description: ID sumber daya
          schema:
            type: string
            minLength: 1
      responses:
        '200':
          description: Berhasil
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MissionDetailResponse'
              example:
                success: true
                data:
                  id: m1
                  slug: untuk-minum
                  title: Untuk minum
                  hint: Cari wadah minuman
                  category: Minum dan makan
                  difficulty: easy
                  rewardXp: 110
                  status: available
                  bestStars: 0
                  exercisePlan:
                    - choice
                    - cloze
                    - order
                  acceptedLabels:
                    - model: coco-ssd
                      label: cup
                      minConfidence: 0.6
                      vocabularyId: v-cup
                  targetCount: 1
        '401':
          $ref: '#/components/responses/401'
        '404':
          $ref: '#/components/responses/404'
        '429':
          $ref: '#/components/responses/429'
        '500':
          $ref: '#/components/responses/500'
  /missions/{id}/sessions:
    post:
      operationId: startSession
      summary: Mulai sesi misi
      security:
        - bearerAuth: []
      description: 409 MISSION_LOCKED bila prasyarat misi belum selesai.
      parameters:
        - name: id
          in: path
          required: true
          description: ID sumber daya
          schema:
            type: string
            minLength: 1
      responses:
        '201':
          description: Berhasil dibuat
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StartSessionResponse'
              example:
                success: true
                data:
                  sessionId: session-demo
                  acceptedLabels:
                    - model: coco-ssd
                      label: cup
                      minConfidence: 0.6
                      vocabularyId: v-cup
        '401':
          $ref: '#/components/responses/401'
        '404':
          $ref: '#/components/responses/404'
        '409':
          description: 'MISSION_LOCKED: Prasyarat misi belum selesai.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                MISSION_LOCKED:
                  summary: Prasyarat misi belum selesai.
                  value:
                    success: false
                    error:
                      code: MISSION_LOCKED
                      message: Prasyarat misi belum selesai.
                      details: null
        '429':
          $ref: '#/components/responses/429'
        '500':
          $ref: '#/components/responses/500'
  /sessions/{sid}/hints:
    post:
      operationId: hint
      summary: Minta petunjuk sesi
      security:
        - bearerAuth: []
      description: 409 SESSION_COMPLETED bila sesi telah selesai.
      parameters:
        - name: sid
          in: path
          required: true
          description: ID sumber daya
          schema:
            type: string
            minLength: 1
      responses:
        '200':
          description: Berhasil
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HintResponse'
              example:
                success: true
                data:
                  hint: Cari cangkir di dekatmu
                  hintCount: 1
        '401':
          $ref: '#/components/responses/401'
        '404':
          $ref: '#/components/responses/404'
        '409':
          description: 'SESSION_COMPLETED: Sesi telah selesai; petunjuk tidak dapat ditambahkan.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                SESSION_COMPLETED:
                  summary: Sesi telah selesai; petunjuk tidak dapat ditambahkan.
                  value:
                    success: false
                    error:
                      code: SESSION_COMPLETED
                      message: Sesi telah selesai; petunjuk tidak dapat ditambahkan.
                      details: null
        '429':
          $ref: '#/components/responses/429'
        '500':
          $ref: '#/components/responses/500'
  /sessions/{sid}/scan-attempts:
    post:
      operationId: scan
      summary: Catat hasil deteksi; XP baru dikreditkan saat complete
      security:
        - bearerAuth: []
      description: 409 SESSION_COMPLETED bila sesi telah selesai.
      parameters:
        - name: sid
          in: path
          required: true
          description: ID sumber daya
          schema:
            type: string
            minLength: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ScanRequest'
            example:
              label: cup
              confidence: 0.95
              model: coco-ssd
              latencyMs: 45
      responses:
        '200':
          description: Berhasil
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScanResponse'
              example:
                success: true
                data:
                  matched: true
                  alreadyCollected: false
                  vocabulary:
                    id: v-cup
                    word: cup
                    phonetic: /kʌp/
                    meaning: cangkir
                    imageUrl: /images/cup.svg
                    category: Minum dan makan
                    translations: []
                    exampleSentence:
                      id: s-cup-choice
                      text: This is my red cup.
                    related: []
                  xpAwarded: 50
        '401':
          $ref: '#/components/responses/401'
        '404':
          $ref: '#/components/responses/404'
        '409':
          description: 'SESSION_COMPLETED: Sesi telah selesai; hasil pindai tidak dapat ditambahkan.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                SESSION_COMPLETED:
                  summary: Sesi telah selesai; hasil pindai tidak dapat ditambahkan.
                  value:
                    success: false
                    error:
                      code: SESSION_COMPLETED
                      message: Sesi telah selesai; hasil pindai tidak dapat ditambahkan.
                      details: null
        '422':
          $ref: '#/components/responses/422'
        '429':
          $ref: '#/components/responses/429'
        '500':
          $ref: '#/components/responses/500'
  /sessions/{sid}/exercises:
    get:
      operationId: exercises
      summary: Baca latihan deterministik beserta state tanpa kunci
      security:
        - bearerAuth: []
      description: 409 SESSION_NOT_SCANNED bila pindai belum berhasil.
      parameters:
        - name: sid
          in: path
          required: true
          description: ID sumber daya
          schema:
            type: string
            minLength: 1
      responses:
        '200':
          description: Berhasil
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExercisesResponse'
              example:
                success: true
                data:
                  exercises:
                    - id: s-cup-choice
                      kind: choice
                      index: 0
                      state:
                        attemptsUsed: 0
                        solved: false
                        exhausted: false
                      word: cup
                      imageUrl: /images/cup.svg
                      contextSentence: This is my red cup.
                      options:
                        - id: o1
                          text: cangkir
                        - id: o2
                          text: buku
                        - id: o3
                          text: kursi
                        - id: o4
                          text: pisang
                    - id: s-cup-cloze
                      kind: cloze
                      index: 1
                      state:
                        attemptsUsed: 0
                        solved: false
                        exhausted: false
                      parts:
                        - 'The '
                        - ' has a handle.'
                      chips:
                        - id: c1
                          text: cup
                        - id: c2
                          text: book
                        - id: c3
                          text: banana
                      hintTranslation: Cangkir itu memiliki pegangan.
                      speakText: The blank has a handle.
                    - id: s-cup-order
                      kind: order
                      index: 2
                      state:
                        attemptsUsed: 0
                        solved: false
                        exhausted: false
                      tokens:
                        - id: t3
                          text: cup
                        - id: t1
                          text: I
                        - id: t4
                          text: here
                        - id: t2
                          text: put
                      hintTranslation: Saya meletakkan cangkir di sini.
                      endPunctuation: .
        '401':
          $ref: '#/components/responses/401'
        '404':
          $ref: '#/components/responses/404'
        '409':
          description: 'SESSION_NOT_SCANNED: Pindai belum berhasil.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                SESSION_NOT_SCANNED:
                  summary: Pindai belum berhasil.
                  value:
                    success: false
                    error:
                      code: SESSION_NOT_SCANNED
                      message: Pindai belum berhasil.
                      details: null
        '429':
          $ref: '#/components/responses/429'
        '500':
          $ref: '#/components/responses/500'
  /sessions/{sid}/exercises/{eid}/answers:
    post:
      operationId: answer
      summary: Nilai jawaban; kunci hanya saat gagal dan kesempatan habis
      security:
        - bearerAuth: []
      description: >-
        404 EXERCISE_NOT_FOUND atau 409 ATTEMPTS_EXHAUSTED. Hint diberikan setelah salah pertama;
        correctAnswer hanya setelah gagal pada kesempatan terakhir.
      parameters:
        - name: sid
          in: path
          required: true
          description: ID sumber daya
          schema:
            type: string
            minLength: 1
        - name: eid
          in: path
          required: true
          description: ID sumber daya
          schema:
            type: string
            minLength: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AnswerRequest'
            example:
              answer: o1
      responses:
        '200':
          description: >-
            Hasil penilaian jawaban. Setelah salah pada percobaan pertama, hint menyebut huruf
            pertama arti (choice), huruf pertama kata (cloze), atau kata pertama kalimat (order).
            correctAnswer hanya boleh diberikan setelah jawaban gagal dan kesempatan habis; jawaban
            yang sudah benar tidak memberi poin lagi.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnswerResponse'
              example:
                success: true
                data:
                  correct: true
                  attemptNo: 1
                  attemptsLeft: 1
                  pointsAwarded: 10
        '401':
          $ref: '#/components/responses/401'
        '404':
          description: 'EXERCISE_NOT_FOUND: Soal tidak ditemukan pada sesi ini.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                EXERCISE_NOT_FOUND:
                  summary: Soal tidak ditemukan pada sesi ini.
                  value:
                    success: false
                    error:
                      code: EXERCISE_NOT_FOUND
                      message: Soal tidak ditemukan pada sesi ini.
                      details: null
        '409':
          description: 'ATTEMPTS_EXHAUSTED: Kesempatan menjawab soal telah habis.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                ATTEMPTS_EXHAUSTED:
                  summary: Kesempatan menjawab soal telah habis.
                  value:
                    success: false
                    error:
                      code: ATTEMPTS_EXHAUSTED
                      message: Kesempatan menjawab soal telah habis.
                      details: null
        '422':
          $ref: '#/components/responses/422'
        '429':
          $ref: '#/components/responses/429'
        '500':
          $ref: '#/components/responses/500'
  /sessions/{sid}/pronunciation-attempts:
    post:
      operationId: pronunciation
      summary: Nilai kecocokan transkrip; gunakan skor terbaik dalam sesi
      security:
        - bearerAuth: []
      parameters:
        - name: sid
          in: path
          required: true
          description: ID sumber daya
          schema:
            type: string
            minLength: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PronunciationRequest'
            example:
              heardText: This is my red cup.
              recognitionConfidence: 1
              sentenceId: s-cup-choice
      responses:
        '200':
          description: Berhasil
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PronunciationResponse'
              example:
                success: true
                data:
                  score: 100
                  level: good
                  passed: true
                  feedback: Kalimat berhasil dikenali
                  targetWordHeard: true
        '401':
          $ref: '#/components/responses/401'
        '404':
          $ref: '#/components/responses/404'
        '409':
          description: 'SESSION_COMPLETED: Sesi telah selesai; percobaan ucapan tidak dapat ditambahkan.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                SESSION_COMPLETED:
                  summary: Sesi telah selesai; percobaan ucapan tidak dapat ditambahkan.
                  value:
                    success: false
                    error:
                      code: SESSION_COMPLETED
                      message: Sesi telah selesai; percobaan ucapan tidak dapat ditambahkan.
                      details: null
        '422':
          $ref: '#/components/responses/422'
        '429':
          $ref: '#/components/responses/429'
        '500':
          $ref: '#/components/responses/500'
  /sessions/{sid}/complete:
    post:
      operationId: complete
      summary: Selesaikan sesi dan kreditkan XP secara idempoten
      security:
        - bearerAuth: []
      description: >-
        409 SESSION_NOT_SCANNED bila belum dipindai; 409 PRACTICE_INCOMPLETE bila latihan belum
        selesai dan skippedPractice bukan true. Pemanggilan ulang mengembalikan hasil tersimpan
        tanpa kredit XP ulang.
      parameters:
        - name: sid
          in: path
          required: true
          description: ID sumber daya
          schema:
            type: string
            minLength: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CompleteRequest'
            example:
              skippedPractice: false
              skippedSpeak: false
      responses:
        '200':
          description: Berhasil
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CompleteResponse'
              example:
                success: true
                data:
                  stars: 3
                  sessionScore: 100
                  practiceAccuracy: 100
                  speakScore: 100
                  xpBreakdown:
                    scanXp: 50
                    practiceXp: 30
                    speakXp: 30
                  totalXpAwarded: 110
                  levelUp: true
                  newLevel: 2
                  xpInLevel: 30
                  xpForNextLevel: 200
                  collectedWord:
                    id: v-cup
                    word: cup
                    phonetic: /kʌp/
                    meaning: cangkir
                    imageUrl: /images/cup.svg
                    category: Minum dan makan
                    translations: []
                    exampleSentence:
                      id: s-cup-choice
                      text: This is my red cup.
                    related: []
                  alreadyCollected: false
                  nextMission: null
        '401':
          $ref: '#/components/responses/401'
        '404':
          $ref: '#/components/responses/404'
        '409':
          description: >-
            PRACTICE_INCOMPLETE: Masih ada soal belum selesai dan skippedPractice bukan true.
            SESSION_NOT_SCANNED: Sesi belum memiliki pindai yang berhasil.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                PRACTICE_INCOMPLETE:
                  summary: Masih ada soal belum selesai dan skippedPractice bukan true.
                  value:
                    success: false
                    error:
                      code: PRACTICE_INCOMPLETE
                      message: Masih ada soal belum selesai dan skippedPractice bukan true.
                      details: null
                SESSION_NOT_SCANNED:
                  summary: Sesi belum memiliki pindai yang berhasil.
                  value:
                    success: false
                    error:
                      code: SESSION_NOT_SCANNED
                      message: Sesi belum memiliki pindai yang berhasil.
                      details: null
        '422':
          $ref: '#/components/responses/422'
        '429':
          $ref: '#/components/responses/429'
        '500':
          $ref: '#/components/responses/500'
  /vocabulary/{id}:
    get:
      operationId: vocabulary
      summary: Baca kartu dan hanya kalimat choice
      security:
        - bearerAuth: []
      description: 404 NOT_FOUND bila kosakata tidak ditemukan; hanya kalimat choice terbuka pada kartu.
      parameters:
        - name: id
          in: path
          required: true
          description: ID sumber daya
          schema:
            type: string
            minLength: 1
      responses:
        '200':
          description: Berhasil
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VocabularyResponse'
              example:
                success: true
                data:
                  id: v-cup
                  word: cup
                  phonetic: /kʌp/
                  meaning: cangkir
                  imageUrl: /images/cup.svg
                  category: Minum dan makan
                  translations: []
                  exampleSentence:
                    id: s-cup-choice
                    text: This is my red cup.
                  related: []
        '401':
          $ref: '#/components/responses/401'
        '404':
          $ref: '#/components/responses/404'
        '429':
          $ref: '#/components/responses/429'
        '500':
          $ref: '#/components/responses/500'
  /dev/reset:
    delete:
      operationId: reset
      summary: Reset data milik pengguna yang terautentikasi
      security:
        - bearerAuth: []
      parameters:
        - name: X-Demo-Key
          in: header
          required: false
          description: Kunci demo wajib cocok hanya di production; JWT tetap wajib.
          schema:
            type: string
            minLength: 1
      responses:
        '204':
          $ref: '#/components/responses/204'
        '401':
          $ref: '#/components/responses/401'
        '404':
          description: 'NOT_FOUND: reset tidak tersedia di production tanpa kunci demo yang cocok.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                success: false
                error:
                  code: NOT_FOUND
                  message: Rute tidak ditemukan
                  details: null
        '429':
          $ref: '#/components/responses/429'
        '500':
          $ref: '#/components/responses/500'
      description: >-
        JWT wajib untuk menentukan pemilik data. Reset hanya diizinkan bila NODE_ENV bukan
        production ATAU X-Demo-Key cocok dengan DEMO_RESET_KEY. Production dengan kunci
        hilang/salah: 404 NOT_FOUND. Hanya data milik pengguna JWT yang dihapus; XP kembali 20
        dengan satu event welcome.
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    demoKey:
      type: apiKey
      in: header
      name: X-Demo-Key
      description: Kunci tambahan untuk reset di production; operasi juga mewajibkan JWT.
  responses:
    '204':
      description: Berhasil tanpa isi respons
    '401':
      description: Token atau kunci demo tidak sah.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            UNAUTHORIZED:
              summary: Token atau kunci demo tidak sah.
              value:
                success: false
                error:
                  code: UNAUTHORIZED
                  message: Token atau kunci demo tidak sah.
                  details: null
    '404':
      description: Sumber daya tidak ditemukan.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            NOT_FOUND:
              summary: Sumber daya tidak ditemukan.
              value:
                success: false
                error:
                  code: NOT_FOUND
                  message: Sumber daya tidak ditemukan.
                  details: null
    '409':
      description: Operasi bertentangan dengan keadaan sesi atau misi
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    '422':
      description: Masukan tidak lolos validasi.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            VALIDATION_ERROR:
              summary: Masukan tidak lolos validasi.
              value:
                success: false
                error:
                  code: VALIDATION_ERROR
                  message: Masukan tidak lolos validasi.
                  details: null
    '429':
      description: Batas permintaan terlampaui.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            RATE_LIMITED:
              summary: Batas permintaan terlampaui.
              value:
                success: false
                error:
                  code: RATE_LIMITED
                  message: Batas permintaan terlampaui.
                  details: null
    '500':
      description: Kesalahan internal server; pemetaan kode dari enum wajib menunggu keputusan PM.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
  schemas:
    ErrorCode:
      type: string
      enum:
        - VALIDATION_ERROR
        - UNAUTHORIZED
        - NOT_FOUND
        - MISSION_LOCKED
        - SESSION_COMPLETED
        - RATE_LIMITED
        - SESSION_NOT_SCANNED
        - ATTEMPTS_EXHAUSTED
        - EXERCISE_NOT_FOUND
        - PRACTICE_INCOMPLETE
    ErrorResponse:
      type: object
      properties:
        success:
          type: boolean
          const: false
        error:
          type: object
          properties:
            code:
              $ref: '#/components/schemas/ErrorCode'
            message:
              type: string
            details:
              anyOf:
                - type: object
                  propertyNames:
                    type: string
                  additionalProperties: {}
                - type: 'null'
          required:
            - code
            - message
            - details
          additionalProperties: false
      required:
        - success
        - error
      additionalProperties: false
    User:
      type: object
      properties:
        id:
          type: string
          minLength: 1
        nickname:
          type: string
        level:
          type: integer
          minimum: 1
          maximum: 9007199254740991
        totalXp:
          type: integer
          minimum: 0
          maximum: 9007199254740991
        xpInLevel:
          type: integer
          minimum: 0
          maximum: 9007199254740991
        xpForNextLevel:
          type: integer
          minimum: 0
          maximum: 9007199254740991
        streak:
          type: integer
          minimum: 0
          maximum: 9007199254740991
        collectedCount:
          type: integer
          minimum: 0
          maximum: 9007199254740991
        avatarKey:
          type:
            - string
            - 'null'
          maxLength: 80
      required:
        - id
        - nickname
        - level
        - totalXp
        - xpInLevel
        - xpForNextLevel
        - streak
        - collectedCount
      additionalProperties: false
    Vocabulary:
      type: object
      properties:
        id:
          type: string
          minLength: 1
        word:
          type: string
        phonetic:
          type: string
        meaning:
          type: string
        imageUrl:
          type: string
        category:
          type: string
        translations:
          type: array
          items:
            type: object
            properties: {}
            additionalProperties: {}
        exampleSentence:
          type: object
          properties: {}
          additionalProperties: {}
        related:
          type: array
          items:
            type: object
            properties: {}
            additionalProperties: {}
      required:
        - id
        - word
        - phonetic
        - meaning
        - imageUrl
        - category
        - translations
        - exampleSentence
        - related
      additionalProperties: false
    Mission:
      type: object
      properties:
        id:
          type: string
          minLength: 1
        slug:
          type: string
        title:
          type: string
        hint:
          type: string
        category:
          type: string
        difficulty:
          type: string
        rewardXp:
          type: integer
          minimum: 0
          maximum: 9007199254740991
        status:
          type: string
        bestStars:
          type: integer
          minimum: 0
          maximum: 3
        exercisePlan:
          type: array
          items:
            $ref: '#/components/schemas/ExerciseKind'
      required:
        - id
        - slug
        - title
        - category
        - difficulty
        - rewardXp
        - status
        - bestStars
        - exercisePlan
      additionalProperties: false
    MissionDetail:
      type: object
      properties:
        id:
          type: string
          minLength: 1
        slug:
          type: string
        title:
          type: string
        hint:
          type: string
        category:
          type: string
        difficulty:
          type: string
        rewardXp:
          type: integer
          minimum: 0
          maximum: 9007199254740991
        status:
          type: string
        bestStars:
          type: integer
          minimum: 0
          maximum: 3
        exercisePlan:
          type: array
          items:
            $ref: '#/components/schemas/ExerciseKind'
        acceptedLabels:
          type: array
          items:
            $ref: '#/components/schemas/AcceptedLabel'
        targetCount:
          type: integer
          minimum: 0
          maximum: 9007199254740991
      required:
        - id
        - slug
        - title
        - category
        - difficulty
        - rewardXp
        - status
        - bestStars
        - exercisePlan
        - acceptedLabels
        - targetCount
      additionalProperties: false
    AcceptedLabel:
      type: object
      properties:
        model:
          type: string
        label:
          type: string
        minConfidence:
          type: number
          minimum: 0
          maximum: 1
        vocabularyId:
          type: string
          minLength: 1
      required:
        - model
        - label
        - minConfidence
        - vocabularyId
      additionalProperties: false
    ExerciseKind:
      type: string
      enum:
        - choice
        - cloze
        - order
    ExerciseState:
      type: object
      properties:
        attemptsUsed:
          type: integer
          minimum: 0
          maximum: 2
        solved:
          type: boolean
        exhausted:
          type: boolean
      required:
        - attemptsUsed
        - solved
        - exhausted
      additionalProperties: false
    ExerciseOption:
      type: object
      properties:
        id:
          type: string
          minLength: 1
        text:
          type: string
      required:
        - id
        - text
      additionalProperties: false
    ChoiceExercise:
      type: object
      properties:
        id:
          type: string
          minLength: 1
        kind:
          type: string
          const: choice
        index:
          type: integer
          minimum: 0
          maximum: 9007199254740991
        state:
          $ref: '#/components/schemas/ExerciseState'
        word:
          type: string
        imageUrl:
          type: string
        contextSentence:
          type: string
        options:
          minItems: 4
          maxItems: 4
          type: array
          items:
            $ref: '#/components/schemas/ExerciseOption'
      required:
        - id
        - kind
        - index
        - state
        - word
        - imageUrl
        - contextSentence
        - options
      additionalProperties: false
    ClozeExercise:
      type: object
      properties:
        id:
          type: string
          minLength: 1
        kind:
          type: string
          const: cloze
        index:
          type: integer
          minimum: 0
          maximum: 9007199254740991
        state:
          $ref: '#/components/schemas/ExerciseState'
        parts:
          type: array
          prefixItems:
            - type: string
            - type: string
          items: false
          minItems: 2
          maxItems: 2
        chips:
          minItems: 3
          maxItems: 4
          type: array
          items:
            $ref: '#/components/schemas/ExerciseOption'
        hintTranslation:
          type: string
        speakText:
          type: string
      required:
        - id
        - kind
        - index
        - state
        - parts
        - chips
        - hintTranslation
        - speakText
      additionalProperties: false
    OrderExercise:
      type: object
      properties:
        id:
          type: string
          minLength: 1
        kind:
          type: string
          const: order
        index:
          type: integer
          minimum: 0
          maximum: 9007199254740991
        state:
          $ref: '#/components/schemas/ExerciseState'
        tokens:
          minItems: 1
          type: array
          items:
            $ref: '#/components/schemas/ExerciseOption'
        hintTranslation:
          type: string
        endPunctuation:
          type: string
      required:
        - id
        - kind
        - index
        - state
        - tokens
        - hintTranslation
        - endPunctuation
      additionalProperties: false
    Exercise:
      oneOf:
        - $ref: '#/components/schemas/ChoiceExercise'
        - $ref: '#/components/schemas/ClozeExercise'
        - $ref: '#/components/schemas/OrderExercise'
      discriminator:
        propertyName: kind
        mapping:
          choice: '#/components/schemas/ChoiceExercise'
          cloze: '#/components/schemas/ClozeExercise'
          order: '#/components/schemas/OrderExercise'
    nextMission:
      anyOf:
        - $ref: '#/components/schemas/Mission'
        - type: 'null'
    GuestRequest:
      type: object
      properties:
        nickname:
          type: string
          minLength: 1
          pattern: \S
      required:
        - nickname
      additionalProperties: false
    UpdateMeRequest:
      type: object
      properties:
        nickname:
          type: string
          minLength: 1
          pattern: \S
        avatarKey:
          type:
            - string
            - 'null'
          maxLength: 80
      additionalProperties: false
    ScanRequest:
      type: object
      properties:
        label:
          type: string
        confidence:
          type: number
          minimum: 0
          maximum: 1
        model:
          type: string
        latencyMs:
          type: number
          minimum: 0
      required:
        - label
        - confidence
        - model
        - latencyMs
      additionalProperties: false
    AnswerRequest:
      type: object
      properties:
        answer:
          oneOf:
            - type: string
              minLength: 1
            - minItems: 1
              type: array
              items:
                type: string
                minLength: 1
          description: 'choice: ID opsi; cloze: ID chip; order: array ID token berurutan.'
      required:
        - answer
      additionalProperties: false
    PronunciationRequest:
      type: object
      properties:
        heardText:
          type: string
        recognitionConfidence:
          type: number
          minimum: 0
          maximum: 1
        sentenceId:
          type: string
          minLength: 1
      required:
        - heardText
      additionalProperties: false
    CompleteRequest:
      type: object
      properties:
        skippedPractice:
          type: boolean
        skippedSpeak:
          type: boolean
      additionalProperties: false
    HealthResponse:
      type: object
      properties:
        success:
          type: boolean
          const: true
        data:
          type: object
          properties:
            status:
              type: string
            db:
              type: string
          required:
            - status
            - db
          additionalProperties: false
      required:
        - success
        - data
      additionalProperties: false
    GuestResponse:
      type: object
      properties:
        success:
          type: boolean
          const: true
        data:
          type: object
          properties:
            token:
              type: string
            user:
              $ref: '#/components/schemas/User'
          required:
            - token
            - user
          additionalProperties: false
      required:
        - success
        - data
      additionalProperties: false
    MeResponse:
      type: object
      properties:
        success:
          type: boolean
          const: true
        data:
          $ref: '#/components/schemas/User'
      required:
        - success
        - data
      additionalProperties: false
    UpdateMeResponse:
      type: object
      properties:
        success:
          type: boolean
          const: true
        data:
          $ref: '#/components/schemas/User'
      required:
        - success
        - data
      additionalProperties: false
    CollectionResponse:
      type: object
      properties:
        success:
          type: boolean
          const: true
        data:
          type: array
          items:
            oneOf:
              - type: object
                properties:
                  vocabulary:
                    $ref: '#/components/schemas/Vocabulary'
                  collected:
                    type: boolean
                    const: true
                  bestScore:
                    type: number
                    minimum: 0
                    maximum: 100
                required:
                  - vocabulary
                  - collected
                  - bestScore
                additionalProperties: false
              - type: object
                properties:
                  vocabulary:
                    type: object
                    properties:
                      id:
                        type: string
                        minLength: 1
                      imageUrl:
                        type: string
                    required:
                      - id
                      - imageUrl
                    additionalProperties: false
                  collected:
                    type: boolean
                    const: false
                  bestScore:
                    type: number
                    minimum: 0
                    maximum: 100
                required:
                  - vocabulary
                  - collected
                  - bestScore
                additionalProperties: false
      required:
        - success
        - data
      additionalProperties: false
    MissionsResponse:
      type: object
      properties:
        success:
          type: boolean
          const: true
        data:
          type: array
          items:
            $ref: '#/components/schemas/Mission'
      required:
        - success
        - data
      additionalProperties: false
    MissionDetailResponse:
      type: object
      properties:
        success:
          type: boolean
          const: true
        data:
          $ref: '#/components/schemas/MissionDetail'
      required:
        - success
        - data
      additionalProperties: false
    StartSessionResponse:
      type: object
      properties:
        success:
          type: boolean
          const: true
        data:
          type: object
          properties:
            sessionId:
              type: string
              minLength: 1
            acceptedLabels:
              type: array
              items:
                $ref: '#/components/schemas/AcceptedLabel'
          required:
            - sessionId
            - acceptedLabels
          additionalProperties: false
      required:
        - success
        - data
      additionalProperties: false
    HintResponse:
      type: object
      properties:
        success:
          type: boolean
          const: true
        data:
          type: object
          properties:
            hint:
              type: string
            hintCount:
              type: integer
              minimum: 0
              maximum: 9007199254740991
          required:
            - hint
            - hintCount
          additionalProperties: false
      required:
        - success
        - data
      additionalProperties: false
    ScanResponse:
      type: object
      properties:
        success:
          type: boolean
          const: true
        data:
          type: object
          properties:
            matched:
              type: boolean
            alreadyCollected:
              type: boolean
            vocabulary:
              $ref: '#/components/schemas/Vocabulary'
            xpAwarded:
              type: integer
              minimum: 0
              maximum: 9007199254740991
              description: XP pindai yang akan dikreditkan saat complete; bukan kredit langsung.
          required:
            - matched
            - alreadyCollected
            - xpAwarded
          additionalProperties: false
      required:
        - success
        - data
      additionalProperties: false
    ExercisesResponse:
      type: object
      properties:
        success:
          type: boolean
          const: true
        data:
          type: object
          properties:
            exercises:
              type: array
              items:
                $ref: '#/components/schemas/Exercise'
          required:
            - exercises
          additionalProperties: false
      required:
        - success
        - data
      additionalProperties: false
    AnswerResponse:
      type: object
      properties:
        success:
          type: boolean
          const: true
        data:
          anyOf:
            - type: object
              properties:
                correct:
                  type: boolean
                attemptNo:
                  type: integer
                  minimum: 1
                  maximum: 2
                attemptsLeft:
                  type: integer
                  minimum: 0
                  maximum: 1
                pointsAwarded:
                  type: integer
                  minimum: 0
                  maximum: 9007199254740991
                hint:
                  type: string
              required:
                - correct
                - attemptNo
                - attemptsLeft
                - pointsAwarded
              additionalProperties: false
            - type: object
              properties:
                correct:
                  type: boolean
                  const: false
                attemptNo:
                  type: integer
                  minimum: 1
                  maximum: 2
                attemptsLeft:
                  type: number
                  const: 0
                pointsAwarded:
                  type: integer
                  minimum: 0
                  maximum: 9007199254740991
                hint:
                  type: string
                correctAnswer:
                  anyOf:
                    - type: string
                    - type: array
                      items:
                        type: string
              required:
                - correct
                - attemptNo
                - attemptsLeft
                - pointsAwarded
              additionalProperties: false
      required:
        - success
        - data
      additionalProperties: false
    PronunciationResponse:
      type: object
      properties:
        success:
          type: boolean
          const: true
        data:
          type: object
          properties:
            score:
              type: number
              minimum: 0
              maximum: 100
            level:
              type: string
              enum:
                - good
                - almost
                - retry
            passed:
              type: boolean
            feedback:
              type: string
            targetWordHeard:
              type: boolean
          required:
            - score
            - level
            - passed
            - feedback
            - targetWordHeard
          additionalProperties: false
      required:
        - success
        - data
      additionalProperties: false
    CompleteResponse:
      type: object
      properties:
        success:
          type: boolean
          const: true
        data:
          type: object
          properties:
            stars:
              type: integer
              minimum: 1
              maximum: 3
            sessionScore:
              type: number
              minimum: 0
              maximum: 100
            practiceAccuracy:
              type: number
              minimum: 0
              maximum: 100
            speakScore:
              type: number
              minimum: 0
              maximum: 100
            xpBreakdown:
              type: object
              properties:
                scanXp:
                  type: integer
                  minimum: 0
                  maximum: 9007199254740991
                practiceXp:
                  type: integer
                  minimum: 0
                  maximum: 9007199254740991
                speakXp:
                  type: integer
                  minimum: 0
                  maximum: 9007199254740991
              required:
                - scanXp
                - practiceXp
                - speakXp
              additionalProperties: false
            totalXpAwarded:
              type: integer
              minimum: 0
              maximum: 9007199254740991
            levelUp:
              type: boolean
            newLevel:
              type: integer
              minimum: 1
              maximum: 9007199254740991
            xpInLevel:
              type: integer
              minimum: 0
              maximum: 9007199254740991
            xpForNextLevel:
              type: integer
              minimum: 0
              maximum: 9007199254740991
            collectedWord:
              $ref: '#/components/schemas/Vocabulary'
            alreadyCollected:
              type: boolean
            nextMission:
              $ref: '#/components/schemas/nextMission'
          required:
            - stars
            - sessionScore
            - practiceAccuracy
            - speakScore
            - xpBreakdown
            - totalXpAwarded
            - levelUp
            - newLevel
            - xpInLevel
            - xpForNextLevel
            - collectedWord
            - alreadyCollected
            - nextMission
          additionalProperties: false
      required:
        - success
        - data
      additionalProperties: false
    VocabularyResponse:
      type: object
      properties:
        success:
          type: boolean
          const: true
        data:
          $ref: '#/components/schemas/Vocabulary'
      required:
        - success
        - data
      additionalProperties: false
